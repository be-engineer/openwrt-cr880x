name: cr880x

on:
  workflow_dispatch:
    inputs:
      ssh_enabled:
        description: 'SSH 到构建环境手动修改配置 (make menuconfig 等)'
        required: false
        default: false
        type: boolean
      use_saved_config:
        description: '使用之前保存的 .config 配置文件'
        required: false
        default: false
        type: boolean
      saved_config_run_id:
        description: '配置 artifact 的来源运行 ID (留空自动查找最新)'
        required: false
        type: string
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3 python3-pip rsync unzip zlib1g-dev \
            coccinelle

      - name: Checkout
        uses: actions/checkout@v4

      - name: Hook the openwrt_core URL for opkg
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          TIME="$(curl "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"

          echo "ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:8}" >version
          sed -i "s|%U/targets/%S/packages|https://${OWNER}.github.io/${REPO}/${GITHUB_REF_NAME}/%R|" include/feeds.mk

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # update golang
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/sbwml/packages_lang_golang -b 22.x feeds/packages/lang/golang

      - name: Download saved config
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_saved_config }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ inputs.saved_config_run_id || '' }}"

          if [ -z "$RUN_ID" ]; then
            echo "查找最新的 saved-config artifact..."
            RUN_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=saved-config&per_page=1" \
              --jq '.artifacts[0].workflow_run.id')
          fi

          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo "从运行 #$RUN_ID 下载配置"
            gh run download "$RUN_ID" --name saved-config --dir .
            if [ -f ".config" ]; then
              echo "✅ 已下载之前保存的 .config"
            else
              echo "⚠️ 下载的 artifact 中未找到 .config"
            fi
          else
            echo "未找到之前保存的配置，将使用默认配置"
          fi

      - name: CR880x Configure
        run: |
          cat <<EOF | sed -E 's/^  //' >.config
            CONFIG_TARGET_ipq50xx=y
            CONFIG_TARGET_ipq50xx_arm=y
            CONFIG_TARGET_MULTI_PROFILE=y
            CONFIG_TARGET_ALL_PROFILES=y
            CONFIG_TARGET_PER_DEVICE_ROOTFS=y

            CONFIG_ATH11K_MEM_PROFILE_256M=y

            # CONFIG_IB is not set
            # CONFIG_SDK is not set
            # CONFIG_MAKE_TOOLCHAIN is not set

            CONFIG_ALL_NONSHARED=y
            CONFIG_REPRODUCIBLE_DEBUG_INFO=y

            CONFIG_PACKAGE_kmod-bonding=y
            CONFIG_PACKAGE_kmod-qca-nss-ecm-standard=y
            CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y

            CONFIG_PACKAGE_luci=y
            CONFIG_PACKAGE_luci-app-nikki=y
            CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          EOF

      - name: Merge custom config
        run: |
          make defconfig

      - name: 🔧 SSH debug (tmate)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Save .config as artifact
        uses: actions/upload-artifact@v4
        with:
          name: saved-config
          path: .config
          if-no-files-found: ignore

      - name: Download
        run: |
          make -j8 download

      - name: Build tools
        run: |
          make -j$(nproc) tools/install

      - name: Build toolchain
        run: |
          make -j$(nproc) toolchain/install

      - name: Build all with error handle
        run: |

          make -j$(nproc) IGNORE_ERRORS=1 || make -j1 V=s

      - name: Upload bin to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-ipq50xx-arm
          path: bin/targets/ipq50xx/arm/*

  gh-pages:
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/${GITHUB_REPOSITORY}/git/refs/heads/gh-pages" > /dev/null 2>&1; then
            echo "gh-pages 分支已存在，开始检出"
            git clone --depth=0 \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              -b gh-pages gh-pages
          else
            echo "gh-pages 分支不存在，创建空分支"
            mkdir gh-pages
            git -C gh-pages init -b gh-pages
            git -C gh-pages config user.name 'github-actions[bot]'
            git -C gh-pages config user.email 'github-actions[bot]@users.noreply.github.com'
            git -C gh-pages commit --allow-empty -m "Initial gh-pages branch"
            git -C gh-pages remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Configure the git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Drop old versions
        run: |
          cd gh-pages
          # 如果是新分支（只有1个commit），跳过清理旧版本
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          if [ "$COMMIT_COUNT" -le 1 ]; then
            echo "新分支，跳过清理旧版本"
            exit 0
          fi
          readarray -t old_version < <(git log --format='%h' -- "${GITHUB_REF_NAME}" | tail -n +10)
          GIT_SEQUENCE_EDITOR="sed -i '1 i break'" git rebase --interactive --committer-date-is-author-date --root
          for commit in "${old_version[@]}"; do
            sed -i "/${commit}/d" .git/rebase-merge/git-rebase-todo
          done
          git rebase --continue

      - name: Download bin from artifacts
        uses: actions/download-artifact@v4
        with:
          name: bin-ipq50xx-arm
          path: bin/

      - name: Copy contents
        run: |
          version="$(cat "bin/version.buildinfo")"
          mkdir -p "gh-pages/${GITHUB_REF_NAME}/${version}/"
          cp -avr bin/packages/* "gh-pages/${GITHUB_REF_NAME}/${version}/"

      - name: Commit
        run: |
          cd gh-pages
          git add .
          git commit -m "Add: ${GITHUB_REF_NAME}: $(cat ../bin/version.buildinfo)"

      - name: Publish
        run: |
          cd gh-pages
          git push -f origin gh-pages

  release:
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bin from artifacts
        uses: actions/download-artifact@v4
        with:
          name: bin-ipq50xx-arm
          path: bin/targets/ipq50xx/arm/

      - name: Generate release informations
        run: |
          TIME="$(curl "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"

          TAG="ci-${GITHUB_REF_NAME}-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          echo "TAG=$TAG" >>$GITHUB_ENV

          cat <<EOF | sed -E 's/^  //' >Release.md
            CI ${GITHUB_REF_NAME} $(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')

            # ${GITHUB_REF_NAME}

            Build time: \`$(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')\`
            Release version: ${TAG}

            ## Sources
            $(cat bin/targets/ipq50xx/arm/feeds.buildinfo | awk -F'[ ^]' '{printf "%s: `%s`\n", $2, $4}')

            ## SHA256
            $(cat bin/targets/ipq50xx/arm/sha256sums | awk '{printf "%s: `%s`\n", $2, $1}' | sed -E 's/^\*//')
          EOF

          echo "NAME=$(head --line=1 Release.md)" >>$GITHUB_ENV
          tail --line=+2 Release.md >Body.md

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          body_path: Body.md
          files: |
            bin/targets/ipq50xx/arm/sha256sums
            bin/targets/ipq50xx/arm/*.*
            *.tar
